name: CI/CD - Multi Client Swarm Deploy

on:
  push:
    branches:
      - main

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      # ---------------- Checkout Code ----------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ---------------- Debug (Optional but Recommended) ----------------
      - name: Show Repository Structure
        run: ls -R

      # ---------------- Docker Login ----------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # ---------------- Build & Push Client A ----------------
      - name: Build & Push Client A
        uses: docker/build-push-action@v5
        with:
          context: ./client-a-node
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/client-a:latest

      # ---------------- Build & Push Client B ----------------
      - name: Build & Push Client B
        uses: docker/build-push-action@v5
        with:
          context: ./client-b-python
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/client-b:latest

      # ---------------- Deploy to EC2 Swarm ----------------
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e

            cd /home/rushi/multi-client-swarm

            echo "Pulling latest images..."
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/client-a:latest
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/client-b:latest

            echo "Deploying stack..."
            docker stack deploy -c docker-stack.yaml multi-client

            echo "Services:"
            docker service ls
