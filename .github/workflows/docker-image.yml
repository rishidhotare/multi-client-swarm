name: CI/CD - Multi Client Swarm Deploy

on:
  push:
    branches:
      - main

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      # ===============================
      # 1️⃣ CHECKOUT CODE
      # ===============================
      - name: Checkout Code
        uses: actions/checkout@v4

      # ===============================
      # 2️⃣ SET IMAGE TAG (SHORT SHA)
      # ===============================
      - name: Set Image Tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      # ===============================
      # 3️⃣ SET STACK NAME
      # ===============================
      - name: Set Stack Name
        run: echo "STACK_NAME=multi-client" >> $GITHUB_ENV

      # ===============================
      # 4️⃣ LOGIN TO DOCKERHUB
      # ===============================
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # ===============================
      # 5️⃣ BUILD & PUSH CLIENT A
      # ===============================
      - name: Build & Push Client A
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/client-a:$IMAGE_TAG ./client-a-node
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/client-a:$IMAGE_TAG

      # ===============================
      # 6️⃣ BUILD & PUSH CLIENT B
      # ===============================
      - name: Build & Push Client B
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/client-b:$IMAGE_TAG ./client-b-python
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/client-b:$IMAGE_TAG

      # ===============================
      # 7️⃣ COPY STACK FILE TO EC2
      # ===============================
      - name: Copy docker-stack.yaml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "docker-stack.yaml"
          target: "/home/${{ secrets.EC2_USER }}/multi-client-swarm"

      # ===============================
      # 8️⃣ DEPLOY TO DOCKER SWARM
      # ===============================
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          envs: IMAGE_TAG,STACK_NAME,DOCKERHUB_USERNAME
          script: |
            set -e

            cd /home/rushi/multi-client-swarm

            docker system prune -af
            sleep 10
            
            echo "Deploying stack: $STACK_NAME"
            echo "Using Image Tag: $IMAGE_TAG"

            export IMAGE_TAG=$IMAGE_TAG
            export DOCKERHUB_USERNAME=$DOCKERHUB_USERNAME

            # Remove old stack safely
            docker stack rm $STACK_NAME || true
            sleep 15

            # Pull latest images
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/client-a:$IMAGE_TAG
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/client-b:$IMAGE_TAG

            # Deploy updated stack
            docker stack deploy -c docker-stack.yaml multi-client

            # Wait for services to initialize
            sleep 10
            docker service ls
