name: CI/CD - Multi Client Swarm Deploy

on:
  push:
    branches:
      - main

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Debug - List Files
        run: ls -R

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # ===============================
      # BUILD CLIENT A
      # ===============================
      - name: Build & Push Client A
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/client-a:latest ./client-a-node
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/client-a:latest

      # ===============================
      # BUILD CLIENT B
      # ===============================
      - name: Build & Push Client B
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/client-b:latest ./client-b-python
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/client-b:latest

      # ===============================
      # COPY STACK FILE
      # ===============================
      - name: Copy docker-stack.yaml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "docker-stack.yaml"
          target: "/home/rushi/multi-client-swarm"

      # ===============================
      # DEPLOY TO SWARM
      # ===============================
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e
            cd /home/rushi/multi-client-swarm

            echo "Removing old stack..."
            docker stack rm multi-client || true
            sleep 15

            echo "Pulling latest images..."
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/client-a:latest
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/client-b:latest

            echo "Deploying stack..."
            docker stack deploy -c docker-stack.yaml multi-client

            echo "Waiting for services..."
            sleep 10

            docker service ls
