name: CI/CD - Multi Client Swarm Deploy

on:
  push:
    branches:
      - main
      - dev

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      # ===============================
      # CHECKOUT CODE
      # ===============================
      - name: Checkout Code
        uses: actions/checkout@v4

      # ===============================
      # SET IMAGE TAG (SHORT SHA)
      # ===============================
      - name: Set Image Tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      # ===============================
      # SET STACK NAME BASED ON BRANCH
      # ===============================
      - name: Set Environment Variables
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "STACK_NAME=multi-client" >> $GITHUB_ENV
          else
            echo "STACK_NAME=multi-client-dev" >> $GITHUB_ENV
          fi

      # ===============================
      # LOGIN TO DOCKERHUB
      # ===============================
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # ===============================
      # BUILD & PUSH CLIENT A
      # ===============================
      - name: Build & Push Client A
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/client-a:$IMAGE_TAG ./client-a-node
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/client-a:$IMAGE_TAG

      # ===============================
      # BUILD & PUSH CLIENT B
      # ===============================
      - name: Build & Push Client B
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/client-b:$IMAGE_TAG ./client-b-python
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/client-b:$IMAGE_TAG

      # ===============================
      # COPY STACK FILE TO EC2
      # ===============================
      - name: Copy docker-stack.yaml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "docker-stack.yaml"
          target: "/home/${{ secrets.EC2_USER }}/multi-client-swarm"

      # ===============================
      # DEPLOY TO SWARM
      # ===============================
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e

            cd /home/rushi/multi-client-swarm

            echo "Deploying stack: $STACK_NAME"
            echo "Using Image Tag: $IMAGE_TAG"

            export IMAGE_TAG=${IMAGE_TAG}
            export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}

            docker stack deploy -c docker-stack.yaml $STACK_NAME

            sleep 10
            docker service ls
