name: CI/CD - Multi Client Swarm Deploy

on:
  push:
    branches:
      - main

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build & Push Client A
        uses: docker/build-push-action@v5
        with:
          context: ./client-a-node
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/client-a:latest

      - name: Build & Push Client B
        uses: docker/build-push-action@v5
        with:
          context: ./client-b-python
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/client-b:latest

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e
            cd /home/rushi/multi-client-swarm
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/client-a:latest
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/client-b:latest
            docker stack deploy -c docker-stack.yaml multi-client
            docker service ls
