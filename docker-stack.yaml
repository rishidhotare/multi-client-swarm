version: "3.9"

networks:
  app-network:
    driver: overlay

services:

  traefik:
    image: traefik:v2.10
    command:
      - --providers.docker.swarmMode=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=app-network
      - --entrypoints.web.address=:80
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - app-network
    deploy:
      placement:
        constraints:
          - node.role == manager

  client-a:
    image: rushid03/client-a:latest
    networks:
      - app-network
    secrets:
      - client_a_db
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 10s
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=app-network"
        - "traefik.http.routers.client-a.rule=Host(`43.204.218.55`) && PathPrefix(`/a`)"
        - "traefik.http.routers.client-a.entrypoints=web"
        - "traefik.http.services.client-a.loadbalancer.server.port=3000"

  client-b:
    image: rushid03/client-b:latest
    networks:
      - app-network
    secrets:
      - client_b_db
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 10s
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=app-network"
        - "traefik.http.routers.client-b.rule=Host(`43.204.218.55`) && PathPrefix(`/b`)"
        - "traefik.http.routers.client-b.entrypoints=web"
        - "traefik.http.services.client-b.loadbalancer.server.port=8000"

secrets:
  client_a_db:
    external: true
  client_b_db:
    external: true
