version: "3.9"

networks:
  app-network:
    driver: overlay
    attachable: true   # ✅ Important for Swarm

volumes:
  traefik-certificates:
  client-a-data:
  client-b-data:

services:

  # ---------------- TRAEFIK ----------------
  traefik:
    image: traefik:v2.10
    ports:
      - "80:80"
      - "443:443"
    networks:
      - app-network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certificates:/letsencrypt
    deploy:
      placement:
        constraints:
          - node.role == manager
    command:
      - --providers.docker=true
      - --providers.docker.swarmMode=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=app-network
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.myresolver.acme.tlschallenge=true
      - --certificatesresolvers.myresolver.acme.email=your@email.com
      - --certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json
    configs:
      - source: traefik-acme
        target: /letsencrypt/acme.json

  # ---------------- CLIENT A ----------------
  client-a:
    image: rushid03/client-a:${IMAGE_TAG}
    networks:
      - app-network
    volumes:
      - client-a-data:/data
    secrets:
      - client_a_db
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.client-a.rule=Host(`client-a.yourdomain.com`)"
        - "traefik.http.routers.client-a.entrypoints=websecure"
        - "traefik.http.routers.client-a.tls.certresolver=myresolver"
        - "traefik.http.services.client-a.loadbalancer.server.port=3000"

  # ---------------- CLIENT B ----------------
  client-b:
    image: rushid03/client-b:${IMAGE_TAG}
    networks:
      - app-network
    volumes:
      - client-b-data:/data
    secrets:
      - client_b_db
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.client-b.rule=Host(`client-b.yourdomain.com`)"
        - "traefik.http.routers.client-b.entrypoints=websecure"
        - "traefik.http.routers.client-b.tls.certresolver=myresolver"
        - "traefik.http.services.client-b.loadbalancer.server.port=8000"

secrets:
  client_a_db:
    external: true
  client_b_db:
    external: true

configs:
  traefik-acme:
    file: ./acme.json
